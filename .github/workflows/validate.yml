name: Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Valider les fichiers
        run: node scripts/check.js ${{ github.event_name == 'pull_request' && '--base origin/main' || '' }}
